[build]
command = "pnpm build"
publish = "dist"

[build.environment]
PNPM_VERSION = "12.15.0"

[[redirects]]
from = "/about"
to = "/about/index.html"
status = 200
force = true

[[redirects]]
from = "/about/"
to = "/about/index.html"
status = 200
force = true

[[redirects]]
from = "/*"
to = "/404.html"
status = 404

[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/images/*"
[headers.values]
Cache-Control = "public, max-age=604800"

[[headers]]
for = "/*"
[headers.values]
Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'"
Permissions-Policy = "accelerometer=(), browsing-topics=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
Referrer-Policy = "strict-origin-when-cross-origin"
X-Content-Type-Options = "nosniff"
