[build]
command = "pnpm build"
publish = "dist"

[build.environment]
PNPM_VERSION = "12.15.0"

[[redirects]]
from = "/about"
to = "/index.html"
status = 200

[[redirects]]
from = "/about/"
to = "/index.html"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 404

[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/images/*"
[headers.values]
Cache-Control = "public, max-age=604800"

[[headers]]
for = "/*"
[headers.values]
Referrer-Policy = "strict-origin-when-cross-origin"
X-Content-Type-Options = "nosniff"
